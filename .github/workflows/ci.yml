name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      # Reachability-based CVE check over the standard library and deps. Kept
      # in the test job so a vulnerable toolchain or module fails the build
      # rather than being noticed at deploy time.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Single source of truth: track go.mod so lint and test never drift.
          # NOTE: golangci-lint's own build-Go must be >= go.mod's Go, else its
          # bundled go/types panics ("file requires newer Go version"). When
          # bumping the go.mod Go directive, bump golangci-lint's version below
          # to a release built with that Go or newer.
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
  image:
    needs: [test, lint]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # Pinned explicitly rather than left to the action's defaults,
          # because the Helm chart resolves its image tag from
          # Chart.appVersion (e.g. "0.1.0"). A git tag v0.1.0 must therefore
          # publish 0.1.0 — publishing only the ref name (v0.1.0) would leave
          # the chart pointing at a tag that does not exist.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=main,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
