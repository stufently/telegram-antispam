image:
  repository: ghcr.io/stufently/telegram-antispam
  # tag is intentionally empty: it defaults to Chart.appVersion, so the chart
  # version and the image it deploys can never drift apart. Set it only to
  # pin something other than the chart's own app version (a hotfix build, a
  # digest). Do NOT put "latest" here — it makes rollbacks unrepeatable and
  # hides which build is actually running.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1 # single writer (SQLite) — do NOT scale beyond 1

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

metricsPort: 9090

service:
  # A ClusterIP Service for /metrics and /healthz. Enabled by default: the
  # chart already exposes a metrics port, and without a Service nothing in
  # the cluster can scrape it at a stable address.
  enabled: true
  annotations: {}

probes:
  # Liveness/readiness both hit /healthz on the metrics port. If you set
  # `ops.metrics_enabled: false` in the config below, that port does not
  # exist and the probes fail forever — a CrashLoopBackOff caused purely by
  # turning off metrics. Set this to false together with that option (and
  # with service.enabled), or, better, leave metrics on.
  enabled: true

persistence:
  # SQLite lives on a PVC. The database itself is small (the blocklist mirror
  # is in-memory), but many cloud CSI drivers refuse to provision below their
  # own minimum — Hetzner's is 10Gi, and a 1Gi request there fails outright
  # rather than being rounded up. 10Gi is the smallest portable default.
  size: 10Gi
  # Empty means "the cluster default StorageClass". Naming it explicitly is
  # better practice in a cluster with more than one class, or where the
  # default may be changed later.
  storageClass: ""

# --- Bot token (SECRET) -----------------------------------------------------
# The token is injected into the container as the BOT_TOKEN env var (env wins
# over any bot_token in the config file), so it never lands in the ConfigMap.
#
# Option A (chart-managed): set botToken here and the chart renders a Secret.
#   Fine for quick installs; the value sits in your Helm values/release.
# Option B (external, recommended for prod): pre-create a Secret and reference
# it — leave botToken empty and set existingSecret (+ existingSecretKey).
botToken: ""
existingSecret: "" # name of a pre-existing Secret holding the bot token
existingSecretKey: bot_token # key within existingSecret

# --- LLM credentials (SECRET, optional) -------------------------------------
# The optional borderline LLM stage needs an API key, and the config below is
# rendered into a ConfigMap — i.e. into version control in a GitOps setup.
# So the keys come from a Secret as env vars instead (OPENAI_API_KEY /
# ANTHROPIC_API_KEY override llm.providers[].api_key exactly like BOT_TOKEN
# overrides bot_token). Leave empty when the LLM stage is off.
llmSecret:
  name: "" # name of a pre-existing Secret holding the API key(s)
  openaiKey: "" # key within that Secret holding the OpenAI API key
  anthropicKey: "" # key within that Secret holding the Anthropic API key

# --- Bayes corpus seeding (optional) ----------------------------------------
# Point this at a ConfigMap holding labeled samples (one per line) and the
# chart runs `tg-antispam import` as init containers before the bot starts.
# The import is idempotent — samples are deduplicated by content hash — so it
# is safe on every restart, and it is the only way to seed the corpus on a
# distroless image with a single-writer database: there is no shell to exec
# into, and a separate Job would have to fight the running pod for the RWO
# volume.
#
# ⚠️ Keep the classes roughly balanced. The score includes the class priors,
# so a corpus of mostly-spam shifts every message upward: with 80% spam the
# prior alone contributes about +1.5, which on its own clears a threshold of
# 1.0 and turns ordinary messages into spam verdicts.
training:
  existingConfigMap: "" # name of a ConfigMap with the corpus files
  spamKey: spam.txt
  hamKey: ham.txt
  # Checksum of the corpus content. The chart cannot hash a ConfigMap it does
  # not own, so without this a corpus update would sit in the ConfigMap and
  # only be imported at the next unrelated restart. Put any value that changes
  # with the corpus (e.g. `sha256sum spam.txt ham.txt`) here and the pod rolls.
  checksum: ""

# The bot config.yaml, rendered into a ConfigMap. Do NOT put bot_token or LLM
# api_key here — those come from Secrets above. Provide the rest of your
# config; see config.example.yaml in the repository for every key.
config: |
  admin_chat_id: 0
  action: delete_mute
  chats:
    mode: auto
    start_in_dry_run: true
    # Chats listed here moderate for real, regardless of the dry-run value
    # stored when they first registered. This is how an observed chat goes
    # live — editing start_in_dry_run alone does not affect a chat that has
    # already registered.
    enforce: []
    # Chats pinned to dry-run no matter what; wins over enforce.
    force_dry_run: []
