apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate # single SQLite writer — never run two pods at once
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        # Roll the pod whenever the config changes. This is not a nicety: the
        # bot's own file watcher cannot see a ConfigMap update, because
        # kubelet swaps the mounted ..data directory rather than writing the
        # file, so no write/create event ever arrives for config.yaml. Without
        # this annotation a config change would be applied to the ConfigMap
        # and silently never reach the running process.
        checksum/config: {{ .Values.config | sha256sum }}
        {{- if .Values.training.checksum }}
        # Rolls the pod when the corpus changes: the init containers import it
        # at startup, so without a restart new samples are never learned.
        checksum/corpus: {{ .Values.training.checksum | sha256sum }}
        {{- end }}
    spec:
      automountServiceAccountToken: false # the bot never talks to the API server
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.training.existingConfigMap }}
      initContainers:
        # Two containers rather than one: the runtime image is distroless, so
        # there is no shell to chain two commands in, and the import command
        # takes exactly one file and one label. They run in order, before the
        # bot, against the same database file on the same volume.
        - name: import-spam
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["import", "--label", "spam", "--scope", "global", "--origin", "preset", "/corpus/{{ .Values.training.spamKey }}"]
          env:
            - name: DB_PATH
              value: /data/antispam.db
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: corpus
              mountPath: /corpus
              readOnly: true
            # Same reason as the main container: the root filesystem is
            # read-only, and SQLite spills to /tmp for large sorts. An
            # import is exactly the operation that sorts.
            - name: tmp
              mountPath: /tmp
        - name: import-ham
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["import", "--label", "ham", "--scope", "global", "--origin", "preset", "/corpus/{{ .Values.training.hamKey }}"]
          env:
            - name: DB_PATH
              value: /data/antispam.db
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: corpus
              mountPath: /corpus
              readOnly: true
            # Same reason as the main container: the root filesystem is
            # read-only, and SQLite spills to /tmp for large sorts. An
            # import is exactly the operation that sorts.
            - name: tmp
              mountPath: /tmp
      {{- end }}
      containers:
        - name: tg-antispam
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # everything writable lives on /data
            capabilities:
              drop: ["ALL"]
          env:
            - name: CONFIG_PATH
              value: /config/config.yaml
            - name: DB_PATH
              value: /data/antispam.db
            {{- if or .Values.botToken .Values.existingSecret }}
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | default (printf "%s-bot-token" .Release.Name) }}
                  key: {{ if .Values.existingSecret }}{{ .Values.existingSecretKey }}{{ else }}bot_token{{ end }}
            {{- end }}
            {{- if and .Values.llmSecret.name .Values.llmSecret.openaiKey }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llmSecret.name }}
                  key: {{ .Values.llmSecret.openaiKey }}
            {{- end }}
            {{- if and .Values.llmSecret.name .Values.llmSecret.anthropicKey }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llmSecret.name }}
                  key: {{ .Values.llmSecret.anthropicKey }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
          {{- if .Values.probes.enabled }}
          # Liveness hits /livez: it reports whether the bot has managed a
          # round trip to Telegram recently, which /healthz (a static 200)
          # never could — a revoked token or a wedged poller looked healthy.
          # The thresholds are deliberately slack: the endpoint only turns
          # 503 after 15 minutes without a successful call, and three more
          # failed probes are needed after that. A restart fixes a stuck
          # process, not a Telegram outage, and it costs a full re-fetch of
          # the ~4.9M-entry blocklist.
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 3
          # Readiness stays on /healthz, i.e. on the process. It gates the
          # Service, and a not-ready pod is also a pod nobody scrapes — so
          # tying it to Telegram would blind the monitoring precisely when
          # something is wrong.
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 10
          {{- end }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            # readOnlyRootFilesystem leaves the process with nowhere to put a
            # temporary file; SQLite falls back to disk for large sorts and
            # for VACUUM, so give it a real (pod-local, non-persistent) /tmp
            # rather than discovering the limit under load.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        - name: tmp
          emptyDir: {}
        {{- if .Values.training.existingConfigMap }}
        - name: corpus
          configMap:
            name: {{ .Values.training.existingConfigMap }}
        {{- end }}
