bot_token: "REPLACE_WITH_BOTFATHER_TOKEN"
admin_chat_id: -1000000000000
action: delete_mute
chats:
  mode: auto
  start_in_dry_run: true
  allowlist: []

# detection configures the M3 detection cascade (internal/detect). Every
# field below is optional; unset fields fall back to the defaults shown
# here as comments. Durations are Go duration strings (e.g. "60s", "5m").
detection:
  # Meaningful messages a (chat, user) needs before being treated as
  # trusted (exempt from the link-block rule below). Default: 5. An
  # explicit 0 is honored (everyone is trusted immediately).
  trust_threshold: 5

  rules:
    # Substrings that, if present in a message, are always treated as
    # spam. Case-insensitive. Default: [].
    deny_stopwords: []
    # Substrings that override a deny_stopwords match when also present
    # (e.g. to whitelist a phrase that contains a banned word as a
    # substring). Default: [].
    allow_stopwords: []
    # Block messages containing links from users who are not yet
    # trusted (see trust_threshold). Default: true.
    block_links_for_untrusted: true
    # Domains that are always treated as spam links, regardless of trust.
    # Default: [].
    banned_domains: []

  behavior:
    # Duplicate-message count within dup_window that triggers a hit.
    # 0 disables this check. Default: 3.
    dup_threshold: 3
    # Sliding window for duplicate-message counting. Default: 60s.
    dup_window: 60s
    # Messages at or below this length (in runes) count as "short" for
    # short-message flood detection. Default: 10.
    short_len: 10
    # Short-message count within short_window that triggers a hit.
    # 0 disables this check. Default: 5.
    short_flood_threshold: 5
    # Sliding window for short-message flood counting. Default: 30s.
    short_window: 30s
    # Flag edited messages as a signal on their own. Default: false.
    flag_edits: false

  # M4 naive-Bayes borderline stage (internal/detect.BayesIsSpam), run
  # over messages the earlier rule/behavior stages didn't already decide.
  # Turn the whole stage on or off. Default: true.
  bayes_enabled: true
  # Minimum log-ratio (see detect.BayesLogRatio) at or above which a
  # message is flagged spam-leaning; 0.0 means "the scorer favors spam at
  # all, however slightly". Default: 0.0. An explicit 0.0 is honored the
  # same as leaving this unset.
  bayes_threshold: 0.0
  # Estimated vocabulary size used for Laplace smoothing of per-token
  # likelihoods (detect.BayesLogRatio's vocabGuess param). 0 is not a
  # meaningful guess, so it is always treated as "unset". Default: 5000.
  bayes_vocab_guess: 5000

  # M5 fake-admin detector: flags newcomers whose display name
  # impersonates a real chat admin (e.g. "Admin Support"). Turn the
  # whole detector on or off. Default: true.
  fake_admin_enabled: true
  # Maximum edit distance between a display name and a real admin's name
  # for the detector to flag it as impersonation. 0 is not a meaningful
  # value (it would only match identical strings), so it is always
  # treated as "unset". Default: 1.
  fake_admin_max_distance: 1
  # Substrings in a display name treated as suspicious admin-impersonation
  # signals, case-insensitive. An explicit empty list ([]) disables this
  # check. Default: [admin, support, verified, moderator].
  fake_admin_suspicious_tags: [admin, support, verified, moderator]
  # How long the fake-admin detector caches a chat's real admin list
  # before refreshing it, in seconds. 0 is not a meaningful TTL, so it is
  # always treated as "unset". Default: 300.
  admin_cache_ttl_seconds: 300

  # M5 reaction-cleanup: removes the bot's own reactions/artifacts once a
  # moderation action has been taken. Default: true.
  reaction_cleanup_enabled: true

  # M5 ephemeral moderation notice: posts a short-lived notice in the
  # chat when a message is removed. Off by default since delivery to a
  # chat isn't guaranteed and the notice text is chat-specific. Default:
  # false.
  ephemeral_notice_enabled: false
  # Text of the ephemeral moderation notice, shown only when
  # ephemeral_notice_enabled is true. Default: "" (no default text).
  ephemeral_notice_text: ""

# blocklist configures the M6 external blocklist syncer (internal/blocklist),
# which pulls spam user-ID lists from lols.bot and cas.chat on a schedule
# and checks new members/messages against the merged set. Every field
# below is optional; unset fields fall back to the defaults shown here as
# comments. Durations are Go duration strings (e.g. "6h", "30s").
blocklist:
  # Turn the whole M6 blocklist syncer on or off. Default: true.
  enabled: true
  # Full lols.bot ban list, re-fetched every full_refresh interval.
  # Default: "https://lols.bot/spam/banlist.txt".
  lols_full_url: "https://lols.bot/spam/banlist.txt"
  # Incremental (last-hour) lols.bot ban list, re-fetched every
  # delta_refresh interval. Default: "https://lols.bot/spam/banlist-1h.txt".
  lols_delta_url: "https://lols.bot/spam/banlist-1h.txt"
  # Full Combot Anti-Spam (CAS) ban list, re-fetched every full_refresh
  # interval. Default: "https://api.cas.chat/export.csv".
  cas_full_url: "https://api.cas.chat/export.csv"
  # How often the full ban lists (lols_full_url, cas_full_url) are
  # re-fetched. Default: 6h.
  full_refresh: 6h
  # How often the incremental ban list (lols_delta_url) is re-fetched.
  # Default: 1h.
  delta_refresh: 1h
  # Per-request timeout used when fetching any of the blocklist sources
  # above. Default: 30s.
  http_timeout: 30s

# ops configures the M7 observability surface: the metrics HTTP server and
# the daily digest scheduler. Every field below is optional; unset fields
# fall back to the defaults shown here as comments.
ops:
  # Turn the /metrics + /healthz HTTP server on or off. Default: true.
  metrics_enabled: true
  # Listen address for the metrics HTTP server. Default: ":9090".
  metrics_addr: ":9090"
  # Turn the daily admin-chat digest scheduler on or off. Default: true.
  digest_enabled: true
  # How often the digest is sent. A non-positive value falls back to the
  # default. Default: 24h.
  digest_interval: 24h

# llm configures the optional, opt-in borderline LLM adjudication stage
# (spec §5.4). It runs one or two paid, official LLM APIs over a message whose
# Bayes score sits just below the threshold (within borderline_band) and
# combines their verdicts under a consensus policy. DISABLED by default: it
# sends message text to an external service, so it is strictly opt-in
# (spec §9 privacy rules). When disabled, no message text ever leaves the bot.
llm:
  # Turn the borderline LLM stage on. Default: false.
  enabled: false
  # Combine multiple providers: "any" (spam if any provider says spam) or
  # "all" (spam only if all agree). Ignored with a single provider.
  # Default: "any".
  policy: any
  # Width below bayes_threshold within which a message is sent to the LLM.
  # Must be > 0 for the stage to run. Default: 0.5.
  borderline_band: 0.5
  # Per-provider call timeout. Default: 10s.
  http_timeout: 10s
  # 1 or 2 backends. kind is "openai" or "anthropic"; api_key and model are
  # that API's credentials and model name. Fail-open: any provider error errs
  # toward "not spam", so an outage or quota exhaustion never causes a ban.
  providers: []
  #  - kind: openai
  #    api_key: "sk-..."
  #    model: gpt-4o-mini
  #  - kind: anthropic
  #    api_key: "sk-ant-..."
  #    model: claude-3-5-haiku-latest
